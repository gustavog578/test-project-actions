<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Test Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .users-table th,
        .users-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        .users-table th {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-view {
            background-color: #cd5418;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .btn-view:hover {
            background-color: #b04612;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            background-color: #2a2a2a;
            margin: 15% auto;
            padding: 25px;
            border: 1px solid #444;
            border-radius: 8px;
            width: 350px;
            text-align: center;
            position: relative;
        }

        .close {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container dashboard-container" style="max-width: 800px;">
        <div class="dashboard-header">
            <h1>Gestión de Usuarios</h1>
            <button class="logout-btn" style="background-color: #555; border-color: #555;"
                onclick="window.location.href='/dashboard'">Volver al Dashboard</button>
        </div>

        <div style="margin-top: 20px; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 10px;">
            <p>Listado de todos los usuarios registrados en el sistema.</p>

            <table class="users-table">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Users will be populated here by users.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- The Modal -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalUsername" style="margin-top: 0; margin-bottom: 15px; font-size: 1.5rem; color: #cd5418;"></h2>
            <p style="font-size: 1.1rem;">Contraseña: <strong id="modalPassword"
                    style="color: white; background: #1a1a1a; padding: 4px 8px; border-radius: 4px;"></strong></p>
        </div>
    </div>

    <script src="users.js"></script>
</body>

</html>
