<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Test Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container dashboard-container">
        <div class="dashboard-header">
            <h1>Dashboard</h1>
            <div style="display: flex; gap: 10px;">
                <button class="logout-btn" style="background-color: #2196F3; border-color: #2196F3;"
                    onclick="window.location.href='/users'">Ver Usuarios</button>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>
        <p>Welcome, <span id="welcomeUser"></span>!</p>
        <div style="margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 10px;">
            <p><strong>Deployment Test:</strong> This area has been updated to verify the AI Documentation & Screenshot
                automation.</p>
            <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.8;">The system should detect this change and
                capture a new screenshot for the deployment report. TEST 2</p>

            <div style="margin-top: 20px;">
                <label for="userSelector" style="display: block; margin-bottom: 8px;">Select User Context:</label>
                <select id="userSelector"
                    style="width: 100%; padding: 10px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 5px;">
                    <option value="MasterASP">MasterASP</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="USER">USER</option>
                </select>
            </div>
            <p id="selectedValueMessage" style="margin-top: 15px; font-weight: 600; color: #cd5418; display: none;">El
                usuario seleccionado es: <span id="selectedUser"></span></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
